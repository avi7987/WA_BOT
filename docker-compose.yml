# ============================================================
#  הרצה בשרת:  docker compose up -d --build
#  צפייה ב-QR:  docker compose logs -f
# ============================================================
services:
  tasks-bot:
    build: .
    container_name: tasks-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jerusalem
      WA_SESSION_PATH: /data/.wwebjs_auth
    ports:
      - "3000:3000"
    volumes:
      - wa-session:/data
    # whatsapp-web.js מריץ דפדפן אמיתי לכל סשן — צריך זיכרון משותף
    shm_size: "1gb"
    # ברירת המחדל של דוקר היא 10 שניות, ואז SIGKILL. זה קצר מדי
    # לסגירת שני דפדפנים, והריגה באמצע כתיבה פוגמת את קובצי החיבור
    # לוואטסאפ — כלומר סריקת QR מחדש. נותנים זמן לסגור כמו שצריך.
    stop_grace_period: 60s

volumes:
  wa-session:
